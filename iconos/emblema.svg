<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Emblema inspirado en Labmédico: caja de Petri con estrías de siembra que se dibujan en secuencia -->
  <defs>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb6f5"/><stop offset=".6" stop-color="#2f7fe0"/><stop offset="1" stop-color="#7fd3f7"/>
    </linearGradient>
  </defs>
  <style>
    .t { fill: none; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; animation: sembrar 7s cubic-bezier(.16,1,.3,1) infinite both; }
    .clara { stroke: #8fdcff; stroke-width: 2.6; }
    .fuerte { stroke: #ffffff; stroke-width: 2.8; opacity: .95; }
    .punto { fill: #ffffff; opacity: 0; animation: aparecer 7s ease infinite; }
    .caja { fill: none; stroke: url(#borde); stroke-width: 4.2; }
    @keyframes sembrar { 0% { stroke-dashoffset: 100; opacity: 0; } 1% { stroke-dashoffset: 99; opacity: 1; } 28%, 82% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes aparecer { 0%, 30% { opacity: 0; } 38%, 82% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .t { animation: none; stroke-dashoffset: 0; opacity: 1; } .punto { animation: none; opacity: 1; } }
  </style>
  <ellipse class="caja" cx="50" cy="51" rx="38" ry="32" transform="rotate(-12 50 51)"/>
  <!-- estrías claras (diagonal descendente) -->
  <path class="t clara" pathLength="100" d="M24 42 L44 80" style="animation-delay:0s"/>
  <path class="t clara" pathLength="100" d="M28 35 L49 78" style="animation-delay:.18s"/>
  <path class="t clara" pathLength="100" d="M32 29 L54 76" style="animation-delay:.36s"/>
  <!-- estrías fuertes (cruzadas), la última termina en la colonia -->
  <path class="t fuerte" pathLength="100" d="M46 22 L30 64" style="animation-delay:.6s"/>
  <path class="t fuerte" pathLength="100" d="M57 20 L40 66" style="animation-delay:.8s"/>
  <path class="t fuerte" pathLength="100" d="M68 24 L50 70 Q48 75 54 74" style="animation-delay:1s"/>
  <circle class="punto" cx="56" cy="73.5" r="3.2"/>
  <!-- puntos de siembra tenues -->
  <g fill="#8fdcff" opacity=".55"><circle cx="70" cy="46" r="1.2"/><circle cx="74" cy="54" r="1"/><circle cx="66" cy="58" r="1.1"/><circle cx="72" cy="62" r=".9"/></g>
</svg>
